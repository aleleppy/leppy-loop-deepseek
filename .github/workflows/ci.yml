name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-22:
    name: Node 22.19 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision required WSL2 release boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $distros = @(wsl.exe --list --quiet | ForEach-Object { $_.Trim([char]0).Trim() })
          if ($distros -notcontains 'Ubuntu') { wsl.exe --install --distribution Ubuntu --no-launch }
          wsl.exe --distribution Ubuntu --user root --exec bash -lc "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bubblewrap util-linux nodejs npm"
          wsl.exe --distribution Ubuntu --exec bash -lc "command -v bwrap && command -v findmnt && command -v node && command -v npm"
      - run: pnpm gate

  node-24-smoke:
    name: Node 24 / Linux smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:smoke
      - run: pnpm pack:check
