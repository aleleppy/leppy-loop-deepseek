- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.LEPPY_REPLAY_FILE
    overrideFile: !!js process.env.LEPPY_REPLAY_OVERRIDE
    providers:
      - id: replay
        name: Replay
        models:
          - id: replay-model
            reasoningEfforts: [high]
            defaultReasoningEffort: high

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.LEPPY_WORKTREE

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.LEPPY_SYSTEM_PROMPT
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.LEPPY_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: tools
  name: ../../dist/worker-tool.js

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
